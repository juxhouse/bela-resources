#artifactType can be `maven`, `gradle` or any other type. Always use `maven` when your build tool (whichever it is) generates a maven-compatible artifact.
artifactType=maven

#groupId can only be present when the artifactType is `maven`
groupId=com.example

#artifactID is always required.
artifactId=your-example-project

#version is optional. Defaults to 0.0.0
version=1.0.0
